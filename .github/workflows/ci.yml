name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-script:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20, 22]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Make script executable
      run: chmod +x create-next-starter.sh
      
    - name: Test script self-check
      run: ./create-next-starter.sh --test

    - name: Test registry stub cleanup after shell-only SIGTERM
      run: node --test scripts/test-registry-sigterm.cjs

    - name: Test Node version gate and non-interactive menu notice
      run: node --test scripts/test-install-robustness.cjs
      
    - name: Test help command
      run: ./create-next-starter.sh --help
      
    - name: Test dry run
      run: ./create-next-starter.sh --dry-run test-app

  test-mcp-server:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install MCP dependencies
      working-directory: ./mcp-server
      run: npm ci
      
    - name: Lint MCP server
      working-directory: ./mcp-server
      run: npm run lint
      
    - name: Build MCP server
      working-directory: ./mcp-server
      run: npm run build
      
    - name: Test MCP server
      working-directory: ./mcp-server
      run: npm test

  test-payments:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install hosted dependencies
      working-directory: ./hosted
      run: npm ci

    - name: Lint hosted payments
      working-directory: ./hosted
      run: npm run lint

    - name: Build hosted payments
      working-directory: ./hosted
      run: npm run build

    - name: Test payments contracts
      working-directory: ./hosted
      run: npm test 